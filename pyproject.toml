[project]
name = "netcup-mcp"
version = "0.1.0"
description = "MCP server for the netcup CCP domain webservice API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0.0",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
netcup-mcp = "netcup_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
markers = ["live: hits the real netcup API, needs credentials"]

[tool.hatch.build.targets.wheel]
packages = ["src/netcup_mcp"]
